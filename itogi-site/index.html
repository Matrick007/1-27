<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Премия 2027 · Центр подсчёта</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0d10'/><path d='M7 22V10l9 7 9-7v12' fill='none' stroke='%23e8c15a' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#0a0c0f;--p1:#10131820;--panel:#11141a;--panel2:#161a21;--line:#222831;--line2:#2c3340;--tx:#e9ebee;--mu:#8b93a0;--mu2:#5d6572;--gold:#e8c15a;--ok:#4ddc9a;--bad:#ff5d5d;--r:14px;
 --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(232,193,90,.07),transparent 70%),var(--bg);color:var(--tx);font:500 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
/* ---------- вход ---------- */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse 60% 50% at 50% 40%,#171b22,#08090c)}
#gate[hidden]{display:none}
.gate-c{width:min(440px,100%);padding:30px 28px 26px;border:1px solid var(--line2);border-radius:18px;background:linear-gradient(180deg,#14181f,#0e1116);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.gate-c .lg{display:flex;align-items:center;gap:12px;margin-bottom:22px}.gate-c .lg svg{width:38px;height:38px}
.gate-c h1{font:800 20px var(--sans);letter-spacing:-.01em}.gate-c .lg small{display:block;font:500 11px var(--mono);letter-spacing:.16em;color:var(--mu);text-transform:uppercase;margin-top:2px}
.fld{display:block;margin-top:12px}.fld span{display:block;margin-bottom:5px;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.fld input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:#0b0e12;outline:0;transition:border-color .2s,box-shadow .2s}.fld input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,193,90,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;font-size:13px;transition:transform .12s,border-color .2s,background .2s}.btn:hover{border-color:#3d4656;background:#1b2029}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#15120a}.btn.pri:hover{background:#f1cd6c}
.btn.sm{height:34px;padding:0 12px;font-size:12px;border-radius:8px}
.gate-c .row{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}.gate-c .or{display:flex;align-items:center;gap:10px;margin:18px 0 2px;font:600 10px var(--mono);letter-spacing:.2em;color:var(--mu2);text-transform:uppercase}.gate-c .or::before,.gate-c .or::after{content:'';flex:1;height:1px;background:var(--line)}
.gate-c .alt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gate-c .err{min-height:1.2em;margin-top:10px;font:600 12px var(--sans);color:var(--bad)}
/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:22px 16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:rgba(10,12,15,.7);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}.brand svg{width:32px;height:32px;flex:none}.brand b{display:block;font:800 14px var(--sans);letter-spacing:-.01em}.brand small{font:500 9.5px var(--mono);letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;color:var(--mu);text-decoration:none;font-weight:600;font-size:13px;transition:background .15s,color .15s}.nav a:hover{background:var(--panel);color:var(--tx)}
.nav a.on{background:var(--panel2);color:var(--tx)}.nav a i{font:700 10px var(--mono);font-style:normal;color:var(--mu2)}.nav a em{font:700 11px var(--mono);font-style:normal;color:var(--mu)}.nav a.on i{color:var(--c,var(--gold))}
.nav .sep{margin:10px 10px 4px;font:600 9.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mu2)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.st{display:flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.06em;color:var(--mu)}.st i{width:8px;height:8px;border-radius:50%;background:var(--mu2)}.st.live i{background:var(--ok);box-shadow:0 0 0 0 rgba(77,220,154,.6);animation:pulse 2s infinite}.st.demo i{background:var(--gold)}.st.err i{background:var(--bad)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(77,220,154,0)}100%{box-shadow:0 0 0 0 rgba(77,220,154,0)}}
main{padding:26px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font:800 clamp(22px,3vw,30px)/1.1 var(--sans);letter-spacing:-.02em}.top p{margin-top:6px;font:500 12px var(--mono);color:var(--mu);letter-spacing:.04em}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font:600 12px var(--sans);cursor:pointer;user-select:none}.sw i{position:relative;width:26px;height:14px;border-radius:7px;background:#2a303b;transition:background .2s}.sw i::after{content:'';position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on i{background:var(--ok)}.sw.on i::after{transform:translateX(12px)}
/* ---------- карточки показателей ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{position:relative;padding:16px 16px 14px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),#0e1116);overflow:hidden}
.kpi small{display:block;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.kpi b{display:block;margin:10px 0 4px;font:800 32px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{font:500 11.5px var(--sans);color:var(--mu)}.kpi span em{font-style:normal;font-weight:700;color:var(--ok)}
.kpi.hi{border-color:rgba(232,193,90,.35);background:linear-gradient(180deg,rgba(232,193,90,.09),#0e1116)}.kpi.hi b{color:var(--gold)}
.kpi svg.sp{position:absolute;right:10px;bottom:10px;width:70px;height:26px;opacity:.9}
/* ---------- панели ---------- */
.panel{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),#0e1116)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px 0}.ph h2{font:800 15px var(--sans);letter-spacing:-.01em}.ph small{display:block;margin-top:3px;font:500 11px var(--mono);color:var(--mu);letter-spacing:.04em}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line2);border-radius:9px;background:#0b0e12}.seg button{padding:6px 12px;border-radius:6px;font:700 11px var(--mono);letter-spacing:.06em;color:var(--mu);transition:all .15s}.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.chart{position:relative;padding:6px 14px 14px}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;z-index:5;pointer-events:none;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:#0b0e12ee;backdrop-filter:blur(6px);font:600 11px var(--mono);white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .12s}.tip.on{opacity:1}.tip b{display:block;font:800 16px var(--sans);margin-top:2px}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px}
.hours{padding:14px 20px 20px}.hm{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:10px}.hm i{aspect-ratio:1;border-radius:4px;background:rgba(232,193,90,var(--a,.05));position:relative}.hm i:hover::after{content:attr(data-t);position:absolute;left:50%;bottom:120%;transform:translateX(-50%);padding:3px 7px;border-radius:5px;background:#000;font:600 10px var(--mono);white-space:nowrap;z-index:3}
.hml{display:flex;justify-content:space-between;margin-top:6px;font:600 9.5px var(--mono);color:var(--mu2);letter-spacing:.1em}
/* ---------- номинации ---------- */
.nom{--c:var(--gold);margin-top:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#12161c,#0d1015);overflow:hidden;scroll-margin-top:16px}
.nom::before{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--c),transparent 70%)}
.nh{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px 4px}
.nh .t{display:flex;align-items:baseline;gap:14px}.nh .no{font:700 12px var(--mono);color:var(--c);letter-spacing:.14em}.nh h2{font:800 clamp(18px,2.4vw,24px) var(--sans);letter-spacing:-.02em}
.nh .meta{display:flex;gap:22px}.nh .meta div{text-align:right}.nh .meta small{display:block;font:600 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}.nh .meta b{font:800 22px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}.nh .meta b.up{color:var(--ok)}
.nb{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) 190px;gap:22px;padding:14px 22px 22px;align-items:start}
.pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;min-height:240px;padding:6px 0}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pd .av{position:relative;width:var(--s,54px);height:var(--s,54px);border-radius:50%;overflow:hidden;border:2px solid var(--pc);background:#1b2029;display:grid;place-items:center;font:800 15px var(--sans);color:var(--pc);box-shadow:0 0 0 4px rgba(255,255,255,.03),0 8px 24px color-mix(in srgb,var(--pc) 25%,transparent)}.pd .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pd .nm{margin:8px 0 2px;font:700 11.5px/1.2 var(--sans);max-width:100%;overflow-wrap:anywhere}.pd .vt{font:700 10.5px var(--mono);color:var(--mu)}
.pd .bar{width:100%;margin-top:8px;border-radius:9px 9px 0 0;display:grid;place-items:start center;padding-top:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 40%,#12161c),color-mix(in srgb,var(--pc) 6%,#12161c));border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);border-bottom:0;height:0;transition:height 1s cubic-bezier(.2,.9,.2,1)}
.pd .bar b{font:800 28px var(--sans);color:var(--pc);letter-spacing:-.02em}
.pd.p1{--pc:#e8c15a;--s:66px}.pd.p2{--pc:#c4ccd6}.pd.p3{--pc:#d08a52}
.pd .crown{height:16px;margin-bottom:4px;color:#e8c15a;font-size:16px;line-height:1}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.mini div{padding:10px 10px 9px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}.mini b{display:block;font:800 18px var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--c)}.mini small{display:block;margin-top:2px;font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.tph{margin-top:18px;display:grid;gap:9px}.tph div{display:grid;grid-template-columns:48px 1fr 34px;align-items:center;gap:10px;font:700 11px var(--mono);color:var(--mu)}.tph i{display:block;height:6px;border-radius:3px;background:#1b2029;overflow:hidden}.tph i u{display:block;height:100%;background:linear-gradient(90deg,#9b7d2d,#e8c15a);border-radius:3px}.tph b{color:var(--tx);text-align:right}.tph h4{font:700 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mu2);margin-top:4px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:30px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px 7px 6px;border-radius:10px;cursor:pointer;transition:background .15s}.row:hover{background:rgba(255,255,255,.035)}
.row .pl{font:800 13px var(--mono);text-align:center;color:var(--mu2)}.row.r1 .pl{color:#e8c15a}.row.r2 .pl{color:#c4ccd6}.row.r3 .pl{color:#d08a52}
.row .av{position:relative;width:34px;height:34px;border-radius:50%;overflow:hidden;background:#1b2029;border:1px solid var(--line2);display:grid;place-items:center;font:800 11px var(--sans);color:var(--mu)}.row .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row .mid{min-width:0}.row .nm{display:flex;justify-content:space-between;gap:8px;font:700 13px var(--sans)}.row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .nm em{font:600 11px var(--mono);font-style:normal;color:var(--mu);flex:none}
.row .tr{height:7px;margin-top:6px;border-radius:4px;background:#1b2029;overflow:hidden}.row .tr i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--col) 55%,#000),var(--col));transition:width 1.1s cubic-bezier(.2,.9,.2,1)}
.row .cn{text-align:right;min-width:54px}.row .cn b{display:block;font:800 17px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}.row .cn small{font:700 10px var(--mono);color:var(--ok)}.row .cn small.z{color:var(--mu2)}
.don{display:flex;flex-direction:column;align-items:center;gap:12px}.don svg{width:170px;height:170px}.don .c{font:800 22px var(--sans)}
.don text.big{font:800 28px var(--sans);fill:var(--tx)}.don text.sm{font:600 8.5px var(--mono);fill:var(--mu);letter-spacing:.16em}
.lgd{width:100%;display:grid;gap:5px;font:600 11px var(--sans);color:var(--mu)}.lgd div{display:flex;align-items:center;gap:7px;min-width:0}.lgd i{width:8px;height:8px;border-radius:2px;flex:none}.lgd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.lgd em{font:700 10.5px var(--mono);font-style:normal}
.empty{padding:40px 10px;text-align:center;color:var(--mu);font:500 13px var(--sans)}
/* ---------- таблица ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px 0}.filters input,.filters select{height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:#0b0e12;outline:0;font:600 12.5px var(--sans)}.filters input{flex:1;min-width:200px}.filters input:focus,.filters select:focus{border-color:var(--gold)}
.tw{overflow:auto;margin:14px 0 0;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:980px}
th{position:sticky;top:0;padding:10px 12px;text-align:left;font:700 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);background:#0f1217;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #1a1f27;font:600 12px var(--sans);white-space:nowrap}tr:hover td{background:rgba(255,255,255,.02)}
td.u b{display:block;font-weight:700}td.u small{font:500 10.5px var(--mono);color:var(--mu)}td.t{font:500 11px var(--mono);color:var(--mu)}
.chip{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;padding:3px 8px;border-radius:6px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff);font:700 11px var(--sans);cursor:pointer}.chip.none{color:var(--mu2);border-color:var(--line);background:none;cursor:default}
.pg{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;font:600 11px var(--mono);color:var(--mu)}.pg div{display:flex;gap:6px}
/* ---------- панель «кто за кого» ---------- */
.dr{position:fixed;inset:0;z-index:40;pointer-events:none}.dr .bk{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}.dr .pn{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);padding:22px 20px;overflow:auto;border-left:1px solid var(--line2);background:#0d1015;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.dr.on{pointer-events:auto}.dr.on .bk{opacity:1}.dr.on .pn{transform:none}
.dr h3{font:800 20px var(--sans);letter-spacing:-.01em}.dr .sub{margin:4px 0 16px;font:500 11.5px var(--mono);color:var(--mu)}.dr .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);font-size:16px}
.dr .big{display:flex;gap:20px;margin-bottom:16px;padding:14px 0;border-block:1px solid var(--line)}.dr .big div b{display:block;font:800 26px var(--sans)}.dr .big small{font:600 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.vl{display:flex;flex-direction:column}.vl div{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid #1a1f27;font:600 13px var(--sans)}.vl small{font:500 11px var(--mono);color:var(--mu)}
.foot{margin-top:30px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font:500 11px var(--mono);color:var(--mu2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);padding:10px 16px;border:1px solid var(--line2);border-radius:10px;background:#0b0e12;font:600 12px var(--sans);opacity:0;transition:all .3s;z-index:60}.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.nb{grid-template-columns:minmax(0,1fr) 190px}.pod{grid-column:1/-1}.two{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}.nav{flex-direction:row}.nav a{white-space:nowrap}.nav .sep,.side-foot,.brand small{display:none}.nb{grid-template-columns:1fr}.don{flex-direction:row;flex-wrap:wrap;justify-content:center}.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:24px 30px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* источники: Telegram / сайт */
:root{--tg:#3fa9f5;--web:#ffb02e}
.srcseg button{display:inline-flex;align-items:center;gap:6px}.srcseg .dt,.srcseg .dw,.sbadge i{display:inline-block;width:7px;height:7px;border-radius:50%}.srcseg .dt,.sbadge.t i{background:var(--tg)}.srcseg .dw,.sbadge.w i{background:var(--web)}
.srcp{padding:22px 22px 20px;margin-top:0;margin-bottom:14px;overflow:hidden;position:relative}
.srcp::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px 200px at 0% 0%,rgba(63,169,245,.10),transparent 70%),radial-gradient(520px 200px at 100% 0%,rgba(255,176,46,.09),transparent 70%)}
.sp-h{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.sp-h h2{margin:0;font:800 15px var(--sans);letter-spacing:-.01em}.sp-h small{display:block;margin-top:3px;font:500 11px var(--mono);color:var(--mu)}
.sp-bar{position:relative;display:flex;height:46px;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#0b0e12}
.sp-bar b{display:flex;align-items:center;gap:10px;padding:0 16px;min-width:0;white-space:nowrap;font:800 14px var(--sans);letter-spacing:-.01em;transition:flex-grow 1s cubic-bezier(.2,.9,.2,1);color:#06121c}
.sp-bar b.t{background:linear-gradient(90deg,#2d8fd9,var(--tg))}.sp-bar b.w{background:linear-gradient(90deg,var(--web),#ff9a3c);color:#2a1500;justify-content:flex-end}
.sp-bar b em{font:700 11px var(--mono);font-style:normal;opacity:.75}
.sp-cards{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}

 "row": "Победитель", "name": "Галкин Виталий", "img": "photo/СамыйХодящий/Галкин.png"}, {"v": "Голиков", "row": "Победитель", "name": "Голиков Матвей", "img": "photo/Голиков.jpg"}, {"v": "Иванова", "row": "Победитель", "name": "Иванова Маргарита", "img": "photo/Другие/Рита.jpg"}, {"v": "Куликов", "row": "Победитель", "name": "Куликов Виталий", "img": "photo/Куликов.jpg"}, {"v": "Литнарович", "row": "Победитель", "name": "Литнарович Кирилл", "img": "photo/Литнарович.jpg"}, {"v": "Лукин", "row": "Победитель", "name": "Лукин Александр", "img": "photo/Лукин.jpg"}, {"v": "Полякова", "row": "Победитель", "name": "Полякова Екатерина", "img": "photo/Другие/Полякова.jpg"}, {"v": "Самсонов", "row": "Победитель", "name": "Самсонов Константин", "img": "photo/Самсонов.png"}, {"v": "Сенченко", "row": "Победитель", "name": "Сенченко Дмитрий", "img": "photo/Сенченко.jpg"}, {"v": "Сериков", "row": "Победитель", "name": "Сериков Александр", "img": "photo/Тигр.jpg"}, {"v": "Сидоров", "row": "Победитель", "name": "Сидоров Никита", "img": "photo/Сидоров.jpg"}, {"v": "Фролов", "row": "Победитель", "name": "Фролов Андрей", "img": "photo/Фролов.jpg"}, {"v": "Чертовских", "row": "Победитель", "name": "Чертовских Андрей", "img": "photo/Чертовских.jpg"}]}]/*END*/;
const ACC = ['#47f0a0','#e0554a','#ff3a9a','#ffb02e','#e8c26a','#ff4d3a','#e8c15a'];
const SHORT = ['Ходящий','Прогульщик','Флешбэк','Завод','Студент','Машина','Король'];
const PAL = ['#e8c15a','#47f0a0','#4aa8ff','#ff6a8a','#b78cff','#ff9a3c','#35d6d6','#9aa5b4'];
const CFG = { photoBase: '', refreshSec: 15 };
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; };
const ini = s => String(s).split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const ls = { get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(_){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} } };
let STATE = { mode: '', votes: [], at: 0, err: '' };
let timer = 0, actMode = 'h', page = 0, SRC = '';
const srcOf = v => v.s || ((v.userId && v.userId !== 'Аноним') ? 'tg' : 'web');
const SRCN = { tg: 'Telegram', web: 'Сайт' };
const VIEW = () => SRC ? STATE.votes.filter(v => srcOf(v) === SRC) : STATE.votes;
const sbadge = v => { const k = srcOf(v); return `<span class="sbadge ${k === 'tg' ? 't' : 'w'}"><i></i>${SRCN[k]}</span>`; };

/* ---------- время по Москве ---------- */
const fmtMsk = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Moscow', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
const msk = ts => { const p = fmtMsk.format(ts); return { d: p.slice(0, 10), h: +p.slice(11, 13), m: +p.slice(14, 16), full: p }; };
const dayKey = ts => msk(ts).d;
const shortDate = d => d.slice(8, 10) + '.' + d.slice(5, 7);
const fmtDT = ts => { const m = msk(ts); return shortDate(m.d) + ' ' + m.full.slice(11, 16); };
const ago = ts => { const s = Math.max(0, (Date.now() - ts) / 1000); if(s < 60) return 'только что'; if(s < 3600) return Math.floor(s / 60) + ' мин назад'; if(s < 86400) return Math.floor(s / 3600) + ' ч назад'; return Math.floor(s / 86400) + ' дн назад'; };

/* ---------- агрегация ---------- */
function analyze(votes){
  const today = dayKey(Date.now()), now = Date.now();
  const A = { total: votes.length, today: 0, hour: 0, full: 0, ballots: 0, noms: [], byHour: Array(24).fill(0), last: 0, peakH: -1 };
  votes.forEach(v => { const m = msk(v.ts); if(m.d === today) A.today++; if(now - v.ts < 3600e3) A.hour++; A.byHour[m.h]++; A.last = Math.max(A.last, v.ts); });
  A.peakH = A.byHour.some(x => x) ? A.byHour.indexOf(Math.max(...A.byHour)) : -1;
  NOMS.forEach((n, i) => {
    const map = new Map(); n.cands.forEach(c => map.set(c.v, { c, n: 0, today: 0, voters: [] }));
    let tot = 0, tod = 0;
    votes.forEach(v => { const pick = v.votes?.[n.cands[0]?.row]; if(pick == null) return; let e = map.get(pick); if(!e){ e = { c: { v: pick, name: pick, img: '', row: n.cands[0].row, ghost: 1 }, n: 0, today: 0, voters: [] }; map.set(pick, e); }
      e.n++; tot++; const t = dayKey(v.ts) === today; if(t){ e.today++; tod++; } e.voters.push(v); });
    const rows = [...map.values()].sort((a, b) => b.n - a.n || a.c.name.localeCompare(b.c.name, 'ru'));
    rows.forEach(r => { r.tg = r.voters.filter(v => srcOf(v) === 'tg').length; r.web = r.n - r.tg; });
    let place = 0, prev = -1; rows.forEach((r, k) => { if(r.n !== prev){ place = k + 1; prev = r.n; } r.place = place; r.pct = tot ? r.n / tot * 100 : 0; });
    A.noms.push({ i, n, rows, total: tot, today: tod }); A.ballots += tot;
  });
  A.full = votes.filter(v => NOMS.every(n => v.votes?.[n.cands[0]?.row] != null)).length;
  return A;
}
function buckets(votes, mode){
  const now = Date.now(); const out = [];
  if(mode === 'h'){ for(let k = 23; k >= 0; k--){ const t = now - k * 3600e3, m = msk(t); out.push({ key: m.d + ' ' + m.h, label: String(m.h).padStart(2, '0') + ':00', n: 0, ttl: shortDate(m.d) + ' ' + String(m.h).padStart(2, '0') + ':00–' + String((m.h + 1) % 24).padStart(2, '0') + ':00' }); } votes.forEach(v => { const m = msk(v.ts), b = out.find(x => x.key === m.d + ' ' + m.h); if(b) b.n++; }); }
  else { for(let k = 13; k >= 0; k--){ const d = dayKey(now - k * 864e5); out.push({ key: d, label: shortDate(d), n: 0, ttl: shortDate(d) }); } votes.forEach(v => { const b = out.find(x => x.key === dayKey(v.ts)); if(b) b.n++; }); }
  return out;
}

/* ---------- мелкие графики ---------- */
function spark(vals, color){
  const w = 70, h = 26, mx = Math.max(1, ...vals); const pts = vals.map((v, i) => [i / (vals.length - 1 || 1) * w, h - 2 - v / mx * (h - 4)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  return `<svg class="sp" viewBox="0 0 ${w} ${h}"><path d="${d}L${w} ${h}L0 ${h}Z" fill="${color}" opacity=".14"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function donut(rows, total, color){
  const R = 62, C = 2 * Math.PI * R; let off = 0, s = '';
  const top = rows.filter(r => r.n > 0).slice(0, 7), rest = rows.filter(r => r.n > 0).slice(7).reduce((a, r) => a + r.n, 0);
  const segs = top.map((r, i) => ({ n: r.n, c: PAL[i % PAL.length], name: r.c.name })); if(rest) segs.push({ n: rest, c: '#3b4350', name: 'Остальные' });
  segs.forEach(g => { const len = g.n / total * C; s += `<circle cx="85" cy="85" r="${R}" fill="none" stroke="${g.c}" stroke-width="16" stroke-dasharray="${Math.max(0, len - 2).toFixed(2)} ${(C - Math.max(0, len - 2)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 85 85)"/>`; off += len; });
  return { svg: `<svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${R}" fill="none" stroke="#1b2029" stroke-width="16"/>${s}<text x="85" y="88" text-anchor="middle" class="big">${total}</text><text x="85" y="106" text-anchor="middle" class="sm">ГОЛОСОВ</text></svg>`, segs };
}

async function loadLive(){
  const s = ls.get('premia_admin', {}); const url = (s.url || '').replace(/\/+$/, '');
  const r = await fetch(url + '/stats', { headers: { Authorization: 'Bearer ' + s.key }, cache: 'no-store' });
  if(r.status === 401) throw new Error('Неверный ключ администратора');
  if(!r.ok) throw new Error('Сервер ответил ' + r.status);
  const d = await r.json(); return (d.votes || []).map(v => ({ ...v, ts: +v.ts || 0 }));
}

}

function demoVotes(){
  let s = 20271; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280; const out = [], now = Date.now(), names = ['kirill_l','alex_g','matvey','vitalik','ritulya','kate_p','andrey_t','dima_s','kostya','elchin','ilya_b','nikita','sasha_s','mari','lukin_a'];
  for(let i = 0; i < 168; i++){
    const age = Math.pow(rnd(), 1.7) * 3 * 864e5, ts = now - age, votes = {};
    NOMS.forEach((n, ni) => { if(rnd() < .04 + (i % 11 === 0 ? .1 : 0)) return; const w = n.cands.map((_, k) => Math.pow(.82, (k * 2 + ni * 3) % 7) + .12 + (k === ni % n.cands.length ? .5 : 0)); const sum = w.reduce((a, b) => a + b, 0); let r = rnd() * sum, k = 0; for(; k < w.length - 1; k++){ r -= w[k]; if(r <= 0) break; } votes[n.cands[0].row] = n.cands[k].v; });
    out.push({ id: 'd' + i, userId: String(500000000 + i * 7919), u: i % 9 === 0 ? 'Аноним' : names[i % names.length] + (i >= names.length ? i : ''), name: '', votes, ts, s: rnd() < .64 ? 'tg' : 'web' });

}

  const out = [], seen = new Set(); let data = null; try{ data = JSON.parse(text); }catch(_){}
  const msgs = data?.messages || (Array.isArray(data) ? data : null);
  const push = (txt, ts, idv) => { if(!/проголосовал за/i.test(txt)) return; const mm = txt.match(/@?([^\s@]+)\s+проголосовал за\s*(?:\(([^)]*)\))?:?/i); const sk = mm && mm[2] ? (/сайт/i.test(mm[2]) ? 'web' : 'tg') : undefined; const u = mm ? mm[1] : 'Аноним'; const votes = {}; txt.split('\n').slice(1).forEach(l => { const q = l.match(/^\s*([^:]+):\s*(.+?)\s*$/); if(q) votes[q[1].trim()] = q[2].trim(); }); if(!Object.keys(votes).length) return; if(seen.has(u) && u !== 'Аноним') return; seen.add(u); out.push({ s: sk, id: 'tg' + (idv || out.length), userId: u, u, name: '', votes, ts }); };
  if(msgs){ msgs.forEach(m => { if(m.type && m.type !== 'message') return; const txt = typeof m.text === 'string' ? m.text : (m.text || []).map(p => typeof p === 'string' ? p : p.text).join(''); const ts = m.date_unixtime ? +m.date_unixtime * 1000 : Date.parse(m.date) || Date.now(); push(txt, ts, m.id); }); }
  else { text.split(/\n\s*\n/).forEach((b, i) => push(b.trim(), Date.now() - i * 60e3, i)); }
  return out;
}

function download(name, body, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function exportCsv(){
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['Время МСК', 'Источник', 'ID', 'Ник', 'Имя', ...NOMS.map(n => n.title)].map(q).join(';');
  const rows = [...STATE.votes].sort((a, b) => a.ts - b.ts).map(v => [msk(v.ts).full, SRCN[srcOf(v)], v.userId, v.u, v.name, ...NOMS.map(n => candName(n, v.votes?.[n.cands[0].row] ?? ''))].map(q).join(';'));
  download('premia2027-votes.csv', '﻿' + [head, ...rows].join('\n'), 'text/csv;charset=utf-8');
}
