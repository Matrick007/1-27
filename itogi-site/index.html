<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Премия 2027 · Центр подсчёта</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0d10'/><path d='M7 22V10l9 7 9-7v12' fill='none' stroke='%23b9c4d0' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#0e1013;--panel:#14171b;--panel2:#1a1e23;--line:#24292f;--line2:#2f353d;--tx:#e4e7ea;--mu:#8b929b;--mu2:#5f6670;--gold:#b9c4d0;--ok:#6aa88a;--bad:#c4655e;--r:6px;--tg:#6f9bc9;--web:#c2a266;
 --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--tx);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
/* ---------- вход ---------- */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:var(--bg)}
#gate[hidden]{display:none}
.gate-c{width:min(420px,100%);padding:28px 26px 24px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel)}
.gate-c .lg{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}.gate-c .lg svg{width:34px;height:34px}
.gate-c h1{font:600 18px var(--sans);letter-spacing:0}.gate-c .lg small{display:block;font:400 11px var(--mono);letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-top:2px}
.fld{display:block;margin-top:14px}.fld span{display:block;margin-bottom:6px;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.fld input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);outline:0;transition:border-color .15s}.fld input:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);font-weight:500;font-size:13px;transition:border-color .15s,background .15s}.btn:hover{border-color:#454d58;background:#20252b}
.btn.pri{background:#d5dce3;border-color:#d5dce3;color:#101317;font-weight:600}.btn.pri:hover{background:#e6ebf0}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.gate-c .row{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}.gate-c .or{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font:500 10px var(--mono);letter-spacing:.14em;color:var(--mu2);text-transform:uppercase}.gate-c .or::before,.gate-c .or::after{content:'';flex:1;height:1px;background:var(--line)}
.gate-c .alt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gate-c .err{min-height:1.2em;margin-top:10px;font:500 12px var(--sans);color:var(--bad)}
/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:20px 14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:#0b0d0f}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;border-bottom:1px solid var(--line)}.brand svg{width:28px;height:28px;flex:none}.brand b{display:block;font:600 13.5px var(--sans)}.brand small{font:400 9.5px var(--mono);letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav a{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;border-left:2px solid transparent;color:var(--mu);text-decoration:none;font-weight:500;font-size:13px;transition:background .12s,color .12s}.nav a:hover{background:var(--panel);color:var(--tx)}
.nav a.on{background:var(--panel);color:var(--tx);border-left-color:var(--gold)}.nav a i{font:500 10px var(--mono);font-style:normal;color:var(--mu2)}.nav a em{font:500 11px var(--mono);font-style:normal;color:var(--mu)}.nav a.on i{color:var(--gold)}
.nav .sep{margin:14px 10px 4px;font:500 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mu2)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px 4px 0;border-top:1px solid var(--line)}
.st{display:flex;align-items:center;gap:8px;font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--mu)}.st i{width:7px;height:7px;border-radius:50%;background:var(--mu2)}.st.live i{background:var(--ok)}.st.demo i{background:var(--web)}.st.err i{background:var(--bad)}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0;max-width:1480px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.top h1{font:600 clamp(20px,2.4vw,26px)/1.15 var(--sans);letter-spacing:-.01em}.top p{margin-top:6px;font:400 12px var(--mono);color:var(--mu)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);font:500 12px var(--sans);cursor:pointer;user-select:none}.sw i{position:relative;width:24px;height:12px;border-radius:6px;background:#2b3138;transition:background .15s}.sw i::after{content:'';position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#c9ced4;transition:transform .15s}.sw.on i{background:#4d6f5f}.sw.on i::after{transform:translateX(12px)}
/* ---------- показатели ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.kpi{position:relative;padding:16px 16px 14px;border-right:1px solid var(--line);overflow:hidden}.kpi:last-child{border-right:0}
.kpi small{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.kpi b{display:block;margin:10px 0 4px;font:600 28px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font:400 11.5px var(--sans);color:var(--mu)}.kpi span em{font-style:normal;font-weight:600;color:var(--ok)}
.kpi.hi b{color:#fff}
.kpi svg.sp{position:absolute;right:10px;bottom:10px;width:64px;height:22px;opacity:.8}
/* ---------- панели ---------- */
.panel{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px 0}.ph h2{font:600 14px var(--sans)}.ph small{display:block;margin-top:3px;font:400 11px var(--mono);color:var(--mu)}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line2);border-radius:4px;background:var(--bg)}.seg button{padding:5px 11px;border-radius:3px;font:500 11px var(--mono);letter-spacing:.04em;color:var(--mu);transition:background .12s,color .12s}.seg button.on{background:var(--panel2);color:var(--tx)}
.chart{position:relative;padding:6px 14px 14px}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;z-index:5;pointer-events:none;padding:7px 10px;border:1px solid var(--line2);border-radius:4px;background:#0b0d0f;font:500 11px var(--mono);white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .1s}.tip.on{opacity:1}.tip b{display:block;font:600 15px var(--sans);margin-top:2px}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px}
.hours{padding:14px 20px 20px}.hm{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:10px}.hm i{aspect-ratio:1;border-radius:2px;background:rgba(159,179,200,var(--a,.05));position:relative}.hm i:hover::after{content:attr(data-t);position:absolute;left:50%;bottom:120%;transform:translateX(-50%);padding:3px 7px;border-radius:3px;background:#000;font:500 10px var(--mono);white-space:nowrap;z-index:3}
.hml{display:flex;justify-content:space-between;margin-top:6px;font:500 9.5px var(--mono);color:var(--mu2);letter-spacing:.08em}
/* ---------- номинации ---------- */
.nom{--c:var(--gold);margin-top:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;scroll-margin-top:16px}
.nh{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line)}
.nh .t{display:flex;align-items:baseline;gap:14px}.nh .no{font:500 12px var(--mono);color:var(--mu);letter-spacing:.1em}.nh h2{font:600 clamp(17px,2vw,21px) var(--sans);letter-spacing:-.01em}
.nh .meta{display:flex;gap:26px}.nh .meta div{text-align:right}.nh .meta small{display:block;font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}.nh .meta b{font:600 20px var(--sans);font-variant-numeric:tabular-nums}.nh .meta b.up{color:var(--ok)}
.nb{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) 190px;gap:24px;padding:18px 22px 22px;align-items:start}
.pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;min-height:240px;padding:6px 0}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pd .av{position:relative;width:var(--s,52px);height:var(--s,52px);border-radius:50%;overflow:hidden;border:1px solid var(--pc);background:var(--panel2);display:grid;place-items:center;font:600 14px var(--sans);color:var(--pc)}.pd .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pd .nm{margin:8px 0 2px;font:600 11.5px/1.25 var(--sans);max-width:100%;overflow-wrap:anywhere}.pd .vt{font:400 10.5px var(--mono);color:var(--mu)}
.pd .bar{width:100%;margin-top:8px;border-radius:3px 3px 0 0;display:grid;place-items:start center;padding-top:8px;background:var(--panel2);border:1px solid var(--line2);border-bottom:0;border-top:2px solid var(--pc);height:0;transition:height .6s ease}
.pd .bar b{font:600 24px var(--sans);color:var(--pc)}
.pd.p1{--pc:#dfe4e9;--s:62px}.pd.p2{--pc:#a3acb6}.pd.p3{--pc:#7d8791}
.pd .crown{display:none}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border:1px solid var(--line);border-radius:4px}.mini div{padding:10px 10px 9px;border-right:1px solid var(--line)}.mini div:last-child{border-right:0}.mini b{display:block;font:600 17px var(--sans);font-variant-numeric:tabular-nums;color:var(--tx)}.mini small{display:block;margin-top:2px;font:500 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.tph{margin-top:18px;display:grid;gap:9px}.tph div{display:grid;grid-template-columns:48px 1fr 34px;align-items:center;gap:10px;font:500 11px var(--mono);color:var(--mu)}.tph i{display:block;height:4px;border-radius:2px;background:#20252b;overflow:hidden}.tph i u{display:block;height:100%;background:#8b9cae;border-radius:2px}.tph b{color:var(--tx);text-align:right;font-weight:500}.tph h4{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu2);margin-top:4px}
.list{display:flex;flex-direction:column;gap:1px}
.row{display:grid;grid-template-columns:30px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px 7px 6px;border-radius:4px;cursor:pointer;transition:background .12s}.row:hover{background:rgba(255,255,255,.035)}
.row .pl{font:500 13px var(--mono);text-align:center;color:var(--mu2)}.row.r1 .pl{color:#dfe4e9;font-weight:600}.row.r2 .pl{color:#a3acb6}.row.r3 .pl{color:#7d8791}
.row .av{position:relative;width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font:600 11px var(--sans);color:var(--mu)}.row .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row .mid{min-width:0}.row .nm{display:flex;justify-content:space-between;gap:8px;font:500 13px var(--sans)}.row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .nm em{font:400 11px var(--mono);font-style:normal;color:var(--mu);flex:none}
.row .tr{height:5px;margin-top:6px;border-radius:2px;background:#20252b;overflow:hidden}.row .tr i{display:block;height:100%;width:0;border-radius:2px;background:var(--col);transition:width .7s ease}
.row .cn{text-align:right;min-width:54px}.row .cn b{display:block;font:600 16px var(--sans);font-variant-numeric:tabular-nums}.row .cn small{font:500 10px var(--mono);color:var(--ok)}.row .cn small.z{color:var(--mu2)}
.don{display:flex;flex-direction:column;align-items:center;gap:12px}.don svg{width:170px;height:170px}.don .c{font:600 22px var(--sans)}
.don text.big{font:600 26px var(--sans);fill:var(--tx)}.don text.sm{font:500 8.5px var(--mono);fill:var(--mu);letter-spacing:.14em}
.lgd{width:100%;display:grid;gap:5px;font:500 11px var(--sans);color:var(--mu)}.lgd div{display:flex;align-items:center;gap:7px;min-width:0}.lgd i{width:8px;height:8px;border-radius:1px;flex:none}.lgd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.lgd em{font:500 10.5px var(--mono);font-style:normal}
.empty{padding:40px 10px;text-align:center;color:var(--mu);font:400 13px var(--sans)}
/* ---------- таблица ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px 0}.filters input,.filters select{height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);outline:0;font:400 12.5px var(--sans)}.filters input{flex:1;min-width:200px}.filters input:focus,.filters select:focus{border-color:var(--gold)}
.tw{overflow:auto;margin:14px 0 0;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:980px}
th{position:sticky;top:0;padding:10px 12px;text-align:left;font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);background:#101316;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #1b2025;font:400 12px var(--sans);white-space:nowrap}tr:hover td{background:rgba(255,255,255,.02)}
td.u b{display:block;font-weight:600}td.u small{font:400 10.5px var(--mono);color:var(--mu)}td.t{font:400 11px var(--mono);color:var(--mu)}
.chip{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;padding:2px 8px;border-radius:3px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font:500 11px var(--sans);cursor:pointer;transition:border-color .12s}.chip:hover{border-color:#566070}.chip.none{color:var(--mu2);border-color:transparent;background:none;cursor:default}
.pg{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;font:400 11px var(--mono);color:var(--mu)}.pg div{display:flex;gap:6px}
/* ---------- панель «кто за кого» ---------- */
.dr{position:fixed;inset:0;z-index:40;pointer-events:none}.dr .bk{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}.dr .pn{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);padding:24px 22px;overflow:auto;border-left:1px solid var(--line2);background:var(--panel);transform:translateX(100%);transition:transform .25s ease}
.dr.on{pointer-events:auto}.dr.on .bk{opacity:1}.dr.on .pn{transform:none}
.dr h3{font:600 20px var(--sans)}.dr .sub{margin:4px 0 16px;font:400 11.5px var(--mono);color:var(--mu)}.dr .x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:4px;border:1px solid var(--line2);font-size:14px}
.dr .big{display:flex;gap:24px;margin-bottom:16px;padding:14px 0;border-block:1px solid var(--line)}.dr .big div b{display:block;font:600 24px var(--sans)}.dr .big small{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.vl{display:flex;flex-direction:column}.vl div{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid #1b2025;font:400 13px var(--sans)}.vl small{font:400 11px var(--mono);color:var(--mu)}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font:400 11px var(--mono);color:var(--mu2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);padding:10px 16px;border:1px solid var(--line2);border-radius:4px;background:#0b0d0f;font:500 12px var(--sans);opacity:0;transition:all .2s;z-index:60}.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi{border-bottom:1px solid var(--line)}.nb{grid-template-columns:minmax(0,1fr) 190px}.pod{grid-column:1/-1}.two{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{border:0;padding:0}.nav{flex-direction:row}.nav a{white-space:nowrap;border-left:0}.nav .sep,.side-foot,.brand small{display:none}.nb{grid-template-columns:1fr}.don{flex-direction:row;flex-wrap:wrap;justify-content:center}.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:24px 30px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* источники: Telegram / сайт */
.srcseg button{display:inline-flex;align-items:center;gap:6px}.srcseg .dt,.srcseg .dw,.sbadge i{display:inline-block;width:7px;height:7px;border-radius:50%}.srcseg .dt,.sbadge.t i{background:var(--tg)}.srcseg .dw,.sbadge.w i{background:var(--web)}
.srcp{padding:20px 22px;margin-top:0;margin-bottom:14px;overflow:hidden;position:relative}
.sp-h{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.sp-h h2{margin:0;font:600 14px var(--sans)}.sp-h small{display:block;margin-top:3px;font:400 11px var(--mono);color:var(--mu)}
.sp-bar{position:relative;display:flex;height:38px;border-radius:4px;overflow:hidden;border:1px solid var(--line2);background:var(--bg)}
.sp-bar b{display:flex;align-items:center;gap:10px;padding:0 14px;min-width:0;white-space:nowrap;font:600 13px var(--sans);transition:flex-grow .7s ease;color:#0c1116}
.sp-bar b.t{background:var(--tg)}.sp-bar b.w{background:var(--web);color:#1a1409;justify-content:flex-end}
.sp-bar b em{font:500 11px var(--mono);font-style:normal;opacity:.8}
.sp-cards{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sp-c{border:1px solid var(--line);border-radius:4px;padding:14px 16px;background:var(--bg)}
.sp-c.t{border-top:2px solid var(--tg)}.sp-c.w{border-top:2px solid var(--web)}
.sp-c h3{margin:0;display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.sp-c.t h3{color:var(--tg)}.sp-c.w h3{color:var(--web)}
.sp-c .n{display:flex;align-items:baseline;gap:10px;margin:8px 0 10px}.sp-c .n b{font:600 36px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}.sp-c .n span{font:500 12px var(--mono);color:var(--mu)}
.sp-c .sx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sp-c .sx div{padding-top:8px;border-top:1px solid var(--line)}.sp-c .sx b{display:block;font:600 15px var(--sans);font-variant-numeric:tabular-nums}.sp-c .sx small{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mu2)}

"Куликов Виталий", "img": "photo/Куликов.jpg"}, {"v": "Сериков Александр", "row": "Машина", "name": "Сериков Александр", "img": "photo/Другие/Тигр.jpg"}]}, {"nom": "Пара", "title": "Король Группы", "cands": [{"v": "Алиев", "row": "Победитель", "name": "Алиев Александр", "img": "photo/Алиев.jpg"}, {"v": "Берсенев", "row": "Победитель", "name": "Берсенёв Илья", "img": "photo/Другие/Берсенев.jpg"}, {"v": "Галкин", "row": "Победитель", "name": "Галкин Виталий", "img": "photo/СамыйХодящий/Галкин.png"}, {"v": "Голиков", "row": "Победитель", "name": "Голиков Матвей", "img": "photo/Голиков.jpg"}, {"v": "Иванова", "row": "Победитель", "name": "Иванова Маргарита", "img": "photo/Другие/Рита.jpg"}, {"v": "Куликов", "row": "Победитель", "name": "Куликов Виталий", "img": "photo/Куликов.jpg"}, {"v": "Литнарович", "row": "Победитель", "name": "Литнарович Кирилл", "img": "photo/Литнарович.jpg"}, {"v": "Лукин", "row": "Победитель", "name": "Лукин Александр", "img": "photo/Лукин.jpg"}, {"v": "Полякова", "row": "Победитель", "name": "Полякова Екатерина", "img": "photo/Другие/Полякова.jpg"}, {"v": "Самсонов", "row": "Победитель", "name": "Самсонов Константин", "img": "photo/Самсонов.png"}, {"v": "Сенченко", "row": "Победитель", "name": "Сенченко Дмитрий", "img": "photo/Сенченко.jpg"}, {"v": "Сериков", "row": "Победитель", "name": "Сериков Александр", "img": "photo/Тигр.jpg"}, {"v": "Сидоров", "row": "Победитель", "name": "Сидоров Никита", "img": "photo/Сидоров.jpg"}, {"v": "Фролов", "row": "Победитель", "name": "Фролов Андрей", "img": "photo/Фролов.jpg"}, {"v": "Чертовских", "row": "Победитель", "name": "Чертовских Андрей", "img": "photo/Чертовских.jpg"}]}]/*END*/;
const ACC = ['#b9c4d0','#b9c4d0','#b9c4d0','#b9c4d0','#b9c4d0','#b9c4d0','#b9c4d0'];

const ini = s => String(s).split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const ls = { get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(_){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} } };

const srcOf = v => v.s || ((v.userId && v.userId !== 'Аноним') ? 'tg' : 'web');
const SRCN = { tg: 'Telegram', web: 'Сайт' };

/* ---------- время по Москве ---------- */
const fmtMsk = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Moscow', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
const msk = ts => { const p = fmtMsk.format(ts); return { d: p.slice(0, 10), h: +p.slice(11, 13), m: +p.slice(14, 16), full: p }; };
const dayKey = ts => msk(ts).d;
const shortDate = d => d.slice(8, 10) + '.' + d.slice(5, 7);
const fmtDT = ts => { const m = msk(ts); return shortDate(m.d) + ' ' + m.full.slice(11, 16); };
const ago = ts => { const s = Math.max(0, (Date.now() - ts) / 1000); if(s < 60) return 'только что'; if(s < 3600) return Math.floor(s / 60) + ' мин назад'; if(s < 86400) return Math.floor(s / 3600) + ' ч назад'; return Math.floor(s / 86400) + ' дн назад'; };

/* ---------- агрегация ---------- */
function analyze(votes){
  const today = dayKey(Date.now()), now = Date.now();
  const A = { total: votes.length, today: 0, hour: 0, full: 0, ballots: 0, noms: [], byHour: Array(24).fill(0), last: 0, peakH: -1 };
  votes.forEach(v => { const m = msk(v.ts); if(m.d === today) A.today++; if(now - v.ts < 3600e3) A.hour++; A.byHour[m.h]++; A.last = Math.max(A.last, v.ts); });
  A.peakH = A.byHour.some(x => x) ? A.byHour.indexOf(Math.max(...A.byHour)) : -1;
  NOMS.forEach((n, i) => {
    const map = new Map(); n.cands.forEach(c => map.set(c.v, { c, n: 0, today: 0, voters: [] }));
    let tot = 0, tod = 0;
    votes.forEach(v => { const pick = v.votes?.[n.cands[0]?.row]; if(pick == null) return; let e = map.get(pick); if(!e){ e = { c: { v: pick, name: pick, img: '', row: n.cands[0].row, ghost: 1 }, n: 0, today: 0, voters: [] }; map.set(pick, e); }
      e.n++; tot++; const t = dayKey(v.ts) === today; if(t){ e.today++; tod++; } e.voters.push(v); });
    const rows = [...map.values()].sort((a, b) => b.n - a.n || a.c.name.localeCompare(b.c.name, 'ru'));
    rows.forEach(r => { r.tg = r.voters.filter(v => srcOf(v) === 'tg').length; r.web = r.n - r.tg; });
    let place = 0, prev = -1; rows.forEach((r, k) => { if(r.n !== prev){ place = k + 1; prev = r.n; } r.place = place; r.pct = tot ? r.n / tot * 100 : 0; });
    A.noms.push({ i, n, rows, total: tot, today: tod }); A.ballots += tot;
  });
  A.full = votes.filter(v => NOMS.every(n => v.votes?.[n.cands[0]?.row] != null)).length;
  return A;
}
function buckets(votes, mode){
  const now = Date.now(); const out = [];
  if(mode === 'h'){ for(let k = 23; k >= 0; k--){ const t = now - k * 3600e3, m = msk(t); out.push({ key: m.d + ' ' + m.h, label: String(m.h).padStart(2, '0') + ':00', n: 0, ttl: shortDate(m.d) + ' ' + String(m.h).padStart(2, '0') + ':00–' + String((m.h + 1) % 24).padStart(2, '0') + ':00' }); } votes.forEach(v => { const m = msk(v.ts), b = out.find(x => x.key === m.d + ' ' + m.h); if(b) b.n++; }); }
  else { for(let k = 13; k >= 0; k--){ const d = dayKey(now - k * 864e5); out.push({ key: d, label: shortDate(d), n: 0, ttl: shortDate(d) }); } votes.forEach(v => { const b = out.find(x => x.key === dayKey(v.ts)); if(b) b.n++; }); }
  return out;
}

/* ---------- мелкие графики ---------- */
function spark(vals, color){
  const w = 70, h = 26, mx = Math.max(1, ...vals); const pts = vals.map((v, i) => [i / (vals.length - 1 || 1) * w, h - 2 - v / mx * (h - 4)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  return `<svg class="sp" viewBox="0 0 ${w} ${h}"><path d="${d}L${w} ${h}L0 ${h}Z" fill="${color}" opacity=".14"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function donut(rows, total, color){
  const R = 62, C = 2 * Math.PI * R; let off = 0, s = '';
  const top = rows.filter(r => r.n > 0).slice(0, 7), rest = rows.filter(r => r.n > 0).slice(7).reduce((a, r) => a + r.n, 0);
  const segs = top.map((r, i) => ({ n: r.n, c: PAL[i % PAL.length], name: r.c.name })); if(rest) segs.push({ n: rest, c: '#2c333b', name: 'Остальные' });
  segs.forEach(g => { const len = g.n / total * C; s += `<circle cx="85" cy="85" r="${R}" fill="none" stroke="${g.c}" stroke-width="14" stroke-dasharray="${Math.max(0, len - 2).toFixed(2)} ${(C - Math.max(0, len - 2)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 85 85)"/>`; off += len; });
  return { svg: `<svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${R}" fill="none" stroke="#20252b" stroke-width="14"/>${s}<text x="85" y="88" text-anchor="middle" class="big">${total}</text><text x="85" y="106" text-anchor="middle" class="sm">ГОЛОСОВ</text></svg>`, segs };
}

function countUp(el, to, ms = 900){ const t0 = performance.now(), from = 0; const f = now => { const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e); if(k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }

/* ---------- график активности ---------- */
function drawAct(){
  const b = buckets(VIEW(), actMode), W = 760, H = 220, pl = 34, pr = 10, pt = 14, pb = 28, mx = Math.max(3, ...b.map(x => x.n)), step = Math.ceil(mx / 4), top = step * 4;
  const bw = (W - pl - pr) / b.length, X = i => pl + bw * i + bw / 2, Y = v => pt + (H - pt - pb) * (1 - v / top);
  let g = ''; for(let k = 0; k <= 4; k++){ const y = Y(k * step); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#24292f" stroke-dasharray="${k ? '3 4' : ''}"/><text x="${pl - 8}" y="${y + 3.5}" text-anchor="end" fill="#5d6572" font-size="10" font-family="JetBrains Mono,monospace">${k * step}</text>`; }
  const bars = b.map((x, i) => `<rect x="${(X(i) - bw * .32).toFixed(1)}" y="${Y(x.n).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${(H - pb - Y(x.n)).toFixed(1)}" rx="3" fill="url(#gb)" opacity="${x.n ? 1 : .2}"/>`).join('');
  const line = b.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.n).toFixed(1)).join('');
  const every = actMode === 'h' ? 3 : 1; const labs = b.map((x, i) => i % every === (actMode === 'h' ? (b.length - 1) % 3 : 0) ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" fill="#5d6572" font-size="9.5" font-family="JetBrains Mono,monospace">${x.label}</text>` : '').join('');
  const hit = b.map((x, i) => `<rect x="${pl + bw * i}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent" data-i="${i}"/>`).join('');
  $('#chAct').innerHTML = `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb0c2"/><stop offset="1" stop-color="#9fb0c2" stop-opacity=".55"/></linearGradient></defs>${g}${bars}<path d="${line}" fill="none" stroke="#e4e7ea" stroke-opacity=".5" stroke-width="1.2" stroke-linejoin="round"/>${labs}${hit}</svg><div class="tip" id="tip"></div>`;
  const tip = $('#tip'), box = $('#chAct');
  $$('#chAct rect[data-i]').forEach(r => { r.addEventListener('mouseenter', () => { const x = b[+r.dataset.i]; tip.innerHTML = `${x.ttl}<b>${x.n} ${plural(x.n, 'голос', 'голоса', 'голосов')}</b>`; const rb = r.getBoundingClientRect(), bb = box.getBoundingClientRect(); tip.style.left = (rb.left - bb.left + rb.width / 2) + 'px'; tip.style.top = (Y(x.n) / H * $('svg', box).getBoundingClientRect().height + 6) + 'px'; tip.classList.add('on'); }); r.addEventListener('mouseleave', () => tip.classList.remove('on')); });
  const sum = b.reduce((a, x) => a + x.n, 0); $('#actSub').textContent = (actMode === 'h' ? 'последние 24 часа' : 'последние 14 дней') + ' · ' + sum + ' ' + plural(sum, 'голос', 'голоса', 'голосов');
}

    <div class="vl">${voters.map(v => `<div><span>${sbadge(v)} ${v.u && v.u !== 'Аноним' ? '@' + esc(v.u) : esc(v.name || 'Аноним')}</span><small>${fmtDT(v.ts)}</small></div>`).join('') || '<div class="empty">Пока никто</div>'}</div>`;
  $('#dr').classList.add('on'); $('#drX').onclick = closeDr;
}
const closeDr = () => $('#dr').classList.remove('on');
/* ---------- данные ---------- */
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2600); }
/* ---------- связь: ping → загрузка только при изменениях, повторы, пауза в фоне ---------- */
const CONN = { fails: 0, sig: '', busy: false, lastOk: 0, ping: true, timer: 0, auto: true, first: true };
async function api(path, ms = 9000){
  const s = ls.get('premia_admin', {}), url = (s.url || '').replace(/\/+$/, ''), ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), ms);
  try{
    const r = await fetch(url + path, { headers: { Authorization: 'Bearer ' + s.key }, cache: 'no-store', signal: ctrl.signal });
    if(r.status === 401){ const e = new Error('Неверный ключ администратора'); e.fatal = 1; throw e; }
    if(!r.ok){ const e = new Error('Сервер ответил ' + r.status); e.status = r.status; throw e; }
    return r;
  }catch(e){ if(e.name === 'AbortError') throw new Error('Сервер долго не отвечает'); throw e; }
  finally{ clearTimeout(to); }
}
async function loadLive(){ const d = await (await api('/stats', 15000)).json(); return (d.votes || []).map(v => ({ ...v, ts: +v.ts || 0 })); }
const sigOf = l => l.length + ':' + l.reduce((m, v) => Math.max(m, v.ts), 0);
function announce(old, nw){
  const seen = new Set(old.map(v => v.id)), add = nw.filter(v => !seen.has(v.id)).sort((a, b) => a.ts - b.ts); if(!add.length) return;
  const v = add[add.length - 1], who = v.u && v.u !== 'Аноним' ? '@' + v.u : (v.name || 'Аноним');
  toast(add.length > 1 ? '+' + add.length + ' ' + plural(add.length, 'голос', 'голоса', 'голосов') : '+1 голос · ' + who + ' · ' + SRCN[srcOf(v)]);
  $$('#kpis .kpi:first-child, .srcp').forEach(e => { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); });
}
function paintStatus(){
  const st = $('#st'); if(!st) return; let cls = 'demo', txt = '—';
  if(STATE.mode === 'demo'){ txt = 'ДЕМО-ДАННЫЕ'; } else if(STATE.mode === 'import'){ txt = 'ИМПОРТ ИЗ ЧАТА'; }
  else if(!navigator.onLine){ cls = 'err'; txt = 'НЕТ СЕТИ'; }
  else if(CONN.fails >= 1){ cls = 'warn'; txt = CONN.fails > 2 ? 'НЕТ СВЯЗИ · ПОВТОР' : 'ПЕРЕПОДКЛЮЧЕНИЕ…'; }
  else if(STATE.mode === 'live'){ cls = 'live'; const s = Math.round((Date.now() - CONN.lastOk) / 1000); txt = 'ОНЛАЙН · ' + (s < 4 ? 'сейчас' : s < 60 ? s + ' с назад' : Math.floor(s / 60) + ' мин назад'); }
  st.className = 'st ' + cls; $('span', st).textContent = txt;
}
function planNext(){
  clearTimeout(CONN.timer); if(STATE.mode !== 'live' || !CONN.auto) return;
  const base = document.hidden ? 30000 : CONN.ping ? 5000 : 12000, d = CONN.fails ? Math.min(30000, 1500 * Math.pow(2, CONN.fails - 1)) : base;
  CONN.timer = setTimeout(() => tick(false), d);
}
async function tick(force){
  if(STATE.mode !== 'live' || CONN.busy) return; CONN.busy = true;
  try{
    let changed = true;
    if(CONN.ping && !force){
      try{ const p = await (await api('/ping', 7000)).json(); changed = (p.n + ':' + p.t) !== CONN.psig; CONN.psig = p.n + ':' + p.t; }
      catch(e){ if(e.status === 404){ CONN.ping = false; } else throw e; }
    }
    if(changed || force || !CONN.ping){
      const d = await loadLive(), sg = sigOf(d);
      if(sg !== CONN.sig || force){ const old = STATE.votes; STATE.votes = d; CONN.sig = sg; STATE.at = Date.now(); if(!CONN.first) announce(old, d); render(); CONN.first = false; }
    }
    CONN.fails = 0; CONN.lastOk = Date.now(); STATE.err = '';
  }catch(e){
    if(e.fatal){ STATE.mode = ''; $('#app').hidden = true; $('#gate').hidden = false; $('#gErr').textContent = e.message; CONN.busy = false; return; }
    CONN.fails++; if(STATE.err !== e.message){ STATE.err = e.message; toast(e.message === 'Failed to fetch' ? 'Нет связи с сервером' : e.message); }
  }
  CONN.busy = false; paintStatus(); planNext();
}
async function refresh(manual){ if(STATE.mode === 'live'){ CONN.fails = 0; await tick(true); if(manual) toast('Обновлено'); } else { render(); if(manual) toast('Обновлено'); } }
function schedule(){ clearTimeout(CONN.timer); CONN.auto = $('#swAuto').classList.contains('on'); if(STATE.mode === 'live') planNext(); }
document.addEventListener('visibilitychange', () => { if(!document.hidden && STATE.mode === 'live') tick(false); });
addEventListener('online', () => { CONN.fails = 0; if(STATE.mode === 'live') tick(false); });
addEventListener('offline', paintStatus);
setInterval(() => { if(!document.hidden) paintStatus(); }, 1000);
function enter(mode, votes){ STATE = { mode, votes, at: Date.now(), err: '' }; CONN.fails = 0; CONN.first = true; CONN.lastOk = Date.now(); CONN.sig = sigOf(votes); CONN.psig = CONN.sig; FEEDIDS = null; $('#gate').hidden = true; $('#app').hidden = false; render(); CONN.first = false; schedule(); }
/* демо */
function demoVotes(){
  let s = 20271; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280; const out = [], now = Date.now(), names = ['kirill_l','alex_g','matvey','vitalik','ritulya','kate_p','andrey_t','dima_s','kostya','elchin','ilya_b','nikita','sasha_s','mari','lukin_a'];
  for(let i = 0; i < 168; i++){
    const age = Math.pow(rnd(), 1.7) * 3 * 864e5, ts = now - age, votes = {};
    NOMS.forEach((n, ni) => { if(rnd() < .04 + (i % 11 === 0 ? .1 : 0)) return; const w = n.cands.map((_, k) => Math.pow(.82, (k * 2 + ni * 3) % 7) + .12 + (k === ni % n.cands.length ? .5 : 0)); const sum = w.reduce((a, b) => a + b, 0); let r = rnd() * sum, k = 0; for(; k < w.length - 1; k++){ r -= w[k]; if(r <= 0) break; } votes[n.cands[0].row] = n.cands[k].v; });
    out.push({ id: 'd' + i, userId: String(500000000 + i * 7919), u: i % 9 === 0 ? 'Аноним' : names[i % names.length] + (i >= names.length ? i : ''), name: '', votes, ts, s: rnd() < .64 ? 'tg' : 'web' });
  }
  return out;
}
/* импорт из экспорта чата Telegram */
function importChat(text){
  const out = [], seen = new Set(); let data = null; try{ data = JSON.parse(text); }catch(_){}
  const msgs = data?.messages || (Array.isArray(data) ? data : null);
  const push = (txt, ts, idv) => { if(!/проголосовал за/i.test(txt)) return; const mm = txt.match(/@?([^\s@]+)\s+проголосовал за\s*(?:\(([^)]*)\))?:?/i); const sk = mm && mm[2] ? (/сайт/i.test(mm[2]) ? 'web' : 'tg') : undefined; const u = mm ? mm[1] : 'Аноним'; const votes = {}; txt.split('\n').slice(1).forEach(l => { const q = l.match(/^\s*([^:]+):\s*(.+?)\s*$/); if(q) votes[q[1].trim()] = q[2].trim(); }); if(!Object.keys(votes).length) return; if(seen.has(u) && u !== 'Аноним') return; seen.add(u); out.push({ s: sk, id: 'tg' + (idv || out.length), userId: u, u, name: '', votes, ts }); };
  if(msgs){ msgs.forEach(m => { if(m.type && m.type !== 'message') return; const txt = typeof m.text === 'string' ? m.text : (m.text || []).map(p => typeof p === 'string' ? p : p.text).join(''); const ts = m.date_unixtime ? +m.date_unixtime * 1000 : Date.parse(m.date) || Date.now(); push(txt, ts, m.id); }); }
  else { text.split(/\n\s*\n/).forEach((b, i) => push(b.trim(), Date.now() - i * 60e3, i)); }
  return out;
}
/* экспорт */
function download(name, body, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function exportCsv(){
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['Время МСК', 'Источник', 'ID', 'Ник', 'Имя', ...NOMS.map(n => n.title)].map(q).join(';');
  const rows = [...STATE.votes].sort((a, b) => a.ts - b.ts).map(v => [msk(v.ts).full, SRCN[srcOf(v)], v.userId, v.u, v.name, ...NOMS.map(n => candName(n, v.votes?.[n.cands[0].row] ?? ''))].map(q).join(';'));
  download('premia2027-votes.csv', '﻿' + [head, ...rows].join('\n'), 'text/csv;charset=utf-8');
}

{ const s = ls.get('premia_admin', {}); $('#gUrl').value = s.url || 'https://premia-2027.kirilltop228gamer.workers.dev'; $('#gKey').value = s.key || ''; const q = new URLSearchParams(location.search); if(q.has('demo')) enter('demo', demoVotes()); else if(s.url && s.key) $('#gGo').click(); }
